name: Go

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    name: build + test (race)

    steps:

    - name: Check out code
      uses: actions/checkout@v4

    # Go 版本从 go.mod 读（现在是 1.26），别再写死——写死的话
    # go.mod 里声明的版本比它高，`go build` 会直接报
    # "go.mod requires go >= x"。
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    # ./... 而不是 .：仓库根目录没有 .go 文件，包全在子目录
    # （engine/ websocket/ http/ ...）。
    - name: Build
      run: go build -v ./...

    - name: Test-Race
      run: env GOARCH=amd64 go test -v -race ./...

    - name: Test-amd64
      run: env GOARCH=amd64 go test -v -coverprofile='coverage.out' -covermode=count ./...

    # 上传失败不挂 job：公开仓库没有 token 也能上传，失败了也别把
    # 测试结果盖掉。
    - name: Upload Coverage report
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        fail_ci_if_error: false
